<title>Evaluador de Activos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#F6F8F6; --surface:#FFFFFF; --surface-2:#EEF2EF; --surface-3:#E4EBE7;
  --ink:#121C18; --ink-2:#3D4B45; --ink-3:#6B7B74;
  --rule:#D9E1DC; --rule-2:#BCC8C2;
  --accent:#0B6B4F; --accent-2:#0E8A66; --accent-soft:#E2F0EA;
  --good:#0B6B4F; --good-soft:#E2F0EA;
  --warn:#8A5D0C; --warn-soft:#F6EEDB;
  --bad:#9C3325;  --bad-soft:#F7E7E3;
  --shadow:0 1px 2px rgba(18,28,24,.05), 0 10px 28px -20px rgba(18,28,24,.4);
  --f-d:"Newsreader",Georgia,serif;
  --f-b:"Public Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --f-m:"IBM Plex Mono","SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D1512; --surface:#141E1A; --surface-2:#1B2723; --surface-3:#22302A;
  --ink:#E7EEEA; --ink-2:#B3C1BA; --ink-3:#83978E;
  --rule:#26332D; --rule-2:#35453E;
  --accent:#49C295; --accent-2:#6ED3AC; --accent-soft:#12312A;
  --good:#49C295; --good-soft:#12312A;
  --warn:#D9A648; --warn-soft:#2C2517;
  --bad:#E28C7E;  --bad-soft:#33201C;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 32px -22px rgba(0,0,0,.95);
}}
:root[data-theme="dark"]{
  --paper:#0D1512; --surface:#141E1A; --surface-2:#1B2723; --surface-3:#22302A;
  --ink:#E7EEEA; --ink-2:#B3C1BA; --ink-3:#83978E;
  --rule:#26332D; --rule-2:#35453E;
  --accent:#49C295; --accent-2:#6ED3AC; --accent-soft:#12312A;
  --good:#49C295; --good-soft:#12312A;
  --warn:#D9A648; --warn-soft:#2C2517;
  --bad:#E28C7E;  --bad-soft:#33201C;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 32px -22px rgba(0,0,0,.95);
}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-b);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1320px;margin:0 auto;padding:0 clamp(14px,3vw,32px)}

/* ---------- masthead ---------- */
header.top{background:var(--surface);border-bottom:1px solid var(--rule)}
.topgrid{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
  flex-wrap:wrap;padding:clamp(20px,3vw,30px) 0 clamp(16px,2vw,22px)}
.brand .eyebrow{font-family:var(--f-m);font-size:.66rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--accent);margin-bottom:.5em}
.brand h1{font-family:var(--f-d);font-weight:500;font-size:clamp(1.7rem,3.4vw,2.5rem);
  line-height:1.05;letter-spacing:-.018em;margin:0}
.brand p{margin:.5em 0 0;color:var(--ink-3);font-size:.86rem;max-width:52ch}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface-2);border:1px solid var(--rule);border-radius:5px;
  padding:7px 12px;min-width:96px}
.chip .k{font-family:var(--f-m);font-size:.6rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);display:block}
.chip .v{font-family:var(--f-m);font-size:1.02rem;font-weight:600;color:var(--accent);
  font-variant-numeric:tabular-nums}

/* ---------- tabs ---------- */
nav.tabs{position:sticky;top:0;z-index:30;background:var(--surface);
  border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:thin}
.tabrow{display:flex;gap:2px;min-width:max-content;padding:0 clamp(14px,3vw,32px)}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;
  font-family:var(--f-b);font-size:.82rem;font-weight:600;color:var(--ink-3);
  padding:13px 14px;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--rule-2);margin-right:7px;vertical-align:middle}
.tab[aria-selected="true"] .dot{background:var(--accent)}

main{padding:clamp(22px,3vw,34px) 0 90px}
.panel[hidden]{display:none}
.panelhead{margin-bottom:20px}
.panelhead h2{font-family:var(--f-d);font-weight:500;font-size:clamp(1.35rem,2.4vw,1.75rem);
  margin:0;letter-spacing:-.012em}
.panelhead p{margin:.4em 0 0;color:var(--ink-3);font-size:.88rem;max-width:78ch}

/* ---------- layout ---------- */
.cols{display:grid;gap:clamp(16px,2vw,26px);grid-template-columns:1fr}
@media (min-width:1040px){.cols{grid-template-columns:minmax(340px,400px) minmax(0,1fr);align-items:start}}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:7px;
  box-shadow:var(--shadow);overflow:hidden}
.card > h3{margin:0;padding:11px 16px;background:var(--surface-2);
  border-bottom:1px solid var(--rule);font-family:var(--f-m);font-size:.66rem;
  font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.card .body{padding:14px 16px}

/* ---------- inputs ---------- */
.field{display:grid;grid-template-columns:1fr 128px;gap:10px;align-items:center;
  padding:6px 0;border-bottom:1px dotted var(--rule)}
.field:last-child{border-bottom:0}
.field label{font-size:.83rem;color:var(--ink-2);line-height:1.35}
.field label small{display:block;color:var(--ink-3);font-size:.71rem;font-style:italic;margin-top:1px}
.ibox{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.ibox .pre,.ibox .suf{font-family:var(--f-m);font-size:.76rem;color:var(--ink-3)}
input[type=number]{width:100%;font-family:var(--f-m);font-size:.86rem;font-weight:500;
  text-align:right;padding:5px 7px;border:1px solid var(--rule-2);border-radius:4px;
  background:var(--paper);color:var(--ink);font-variant-numeric:tabular-nums;
  -moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{
  -webkit-appearance:none;margin:0}
input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.derived{font-family:var(--f-m);font-size:.86rem;font-weight:600;text-align:right;
  color:var(--accent);font-variant-numeric:tabular-nums;padding-right:8px}

/* ---------- stats ---------- */
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));padding:14px 16px}
.stat{background:var(--surface-2);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;
  border-top:2px solid var(--rule-2)}
.stat.key{border-top-color:var(--accent);background:var(--accent-soft)}
.stat .k{font-family:var(--f-m);font-size:.61rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);display:block;margin-bottom:3px}
.stat .v{font-family:var(--f-m);font-size:1.18rem;font-weight:600;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;display:block;line-height:1.2}
.stat .n{font-size:.7rem;color:var(--ink-3);display:block;margin-top:3px;line-height:1.35}
.v.pos{color:var(--good)} .v.neg{color:var(--bad)} .v.neutral{color:var(--ink)}

.verdict{margin:0 16px 16px;padding:11px 14px;border-radius:6px;font-size:.88rem;
  font-weight:600;display:flex;align-items:center;gap:10px;border:1px solid transparent}
.verdict.ok{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.verdict.no{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.verdict.mid{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.verdict .mark{font-family:var(--f-m);font-size:1.05rem}
.verdict span.txt{font-weight:500;color:var(--ink-2)}

/* ---------- tables ---------- */
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.79rem;
  font-variant-numeric:tabular-nums;font-family:var(--f-m)}
th,td{padding:5px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--rule)}
thead th{background:var(--surface-2);color:var(--ink-3);font-size:.64rem;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;position:sticky;top:0}
tbody th, td.lab{text-align:left;font-family:var(--f-b);font-size:.8rem;font-weight:400;
  color:var(--ink-2);position:sticky;left:0;background:var(--surface);min-width:230px;
  border-right:1px solid var(--rule)}
tr.sum td, tr.sum th{font-weight:700;color:var(--ink);border-top:1px solid var(--rule-2)}
tr.hi td{background:var(--accent-soft)}
tr.hi th{background:var(--accent-soft);color:var(--ink);font-weight:700}
td.neg{color:var(--bad)}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}

/* ---------- misc ---------- */
.note{padding:11px 16px;font-size:.78rem;color:var(--ink-3);line-height:1.5;
  border-top:1px solid var(--rule);background:var(--surface-2)}
.note b{color:var(--ink-2)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--rule)}
button.act{appearance:none;font-family:var(--f-b);font-size:.78rem;font-weight:600;
  padding:7px 13px;border-radius:5px;border:1px solid var(--rule-2);background:var(--surface-2);
  color:var(--ink-2);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
button.act:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
button.act.ghost:hover{background:var(--bad);border-color:var(--bad);color:#fff}
.themebtn{position:fixed;right:14px;bottom:14px;z-index:50;width:40px;height:40px;
  border-radius:50%;border:1px solid var(--rule-2);background:var(--surface);
  color:var(--ink-2);cursor:pointer;box-shadow:var(--shadow);font-size:1rem;line-height:1}
.chartbox{padding:14px 16px}
.bars{display:flex;flex-direction:column;gap:9px;padding:16px}
.bar-row{display:grid;grid-template-columns:minmax(88px,124px) minmax(0,1fr) minmax(88px,116px);
  gap:12px;align-items:center}
.bar-name{font-size:.8rem;color:var(--ink-2);text-align:right;line-height:1.25}
.bar-track{position:relative;height:22px;background:var(--surface-2);
  border:1px solid var(--rule);border-radius:4px}
.bar-zero{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--rule-2)}
.bar-fill{position:absolute;top:3px;bottom:3px;border-radius:2px;transition:left .2s,width .2s}
.bar-val{font-family:var(--f-m);font-size:.79rem;font-weight:600;text-align:right;
  font-variant-numeric:tabular-nums}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:0 16px 14px;font-size:.72rem;color:var(--ink-3)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.sechead{font-family:var(--f-m);font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--accent);margin:18px 0 8px;font-weight:600}
.sechead:first-child{margin-top:0}
.hint{font-size:.78rem;color:var(--ink-3);padding:0 16px 14px;line-height:1.5}
.pill{display:inline-block;font-family:var(--f-m);font-size:.66rem;padding:2px 7px;
  border-radius:99px;background:var(--surface-3);color:var(--ink-2);margin-left:6px}
.winner{background:var(--good-soft);color:var(--good);font-weight:700}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="wrap topgrid">
    <div class="brand">
      <div class="eyebrow">Profit120 · Presupuesto de capital</div>
      <h1>Evaluador de activos</h1>
      <p>Terreno, inmueble, maquinaria, vehículo o empresa nueva. Captura los supuestos y el modelo recalcula al instante.</p>
    </div>
    <div class="chips">
      <div class="chip"><span class="k">WACC</span><span class="v" id="chipWacc">—</span></div>
      <div class="chip"><span class="k">Ke</span><span class="v" id="chipKe">—</span></div>
      <div class="chip"><span class="k">ISR</span><span class="v" id="chipIsr">—</span></div>
    </div>
  </div>
</header>

<nav class="tabs" aria-label="Secciones">
  <div class="tabrow" id="tabrow" role="tablist"></div>
</nav>

<main class="wrap" id="main"></main>

<button class="themebtn" id="themebtn" title="Cambiar tema" aria-label="Cambiar tema">◐</button>

<script>
(function(){
"use strict";

/* ============================ utilidades ============================ */
const $ = (s,c)=> (c||document).querySelector(s);
const el = (t,cls,txt)=>{const n=document.createElement(t); if(cls)n.className=cls; if(txt!=null)n.textContent=txt; return n;};
const ok = n => n!=null && isFinite(n);
const nfM = n => !ok(n) ? '—' : (n<0?'−':'')+'$'+Math.abs(Math.round(n)).toLocaleString('es-MX');
const nfP = n => !ok(n) ? '—' : (n*100).toFixed(1)+'%';
const nfP2= n => !ok(n) ? '—' : (n*100).toFixed(2)+'%';
const nfX = n => !ok(n) ? '—' : n.toFixed(2)+'x';
const nfN = n => !ok(n) ? '—' : n.toLocaleString('es-MX',{maximumFractionDigits:1});

function npv(rate, cf){ let s=0; for(let i=0;i<cf.length;i++) s += cf[i]/Math.pow(1+rate,i); return s; }
function irr(cf){
  if(!cf.some(v=>v>0)||!cf.some(v=>v<0)) return null;
  let lo=-0.95, hi=5, flo=npv(lo,cf), fhi=npv(hi,cf);
  if(flo*fhi>0) return null;
  for(let i=0;i<300;i++){ const mid=(lo+hi)/2, f=npv(mid,cf);
    if(flo*f<=0){hi=mid;fhi=f;} else {lo=mid;flo=f;} }
  return (lo+hi)/2;
}
function mirr(cf, fin, rein){
  const n=cf.length-1; let pvN=0, fvP=0;
  cf.forEach((c,i)=>{ if(c<0) pvN += c/Math.pow(1+fin,i); else fvP += c*Math.pow(1+rein,n-i); });
  if(pvN>=0 || fvP<=0) return null;
  return Math.pow(fvP/(-pvN), 1/n)-1;
}
function pmt(r,n,pv){ return (r===0||!n)? (n? pv/n : 0) : pv*r/(1-Math.pow(1+r,-n)); }
function saldoRest(r,t,pago,monto){
  if(r===0) return Math.max(0, monto - pago*t);
  return Math.max(0, monto*Math.pow(1+r,t) - pago*((Math.pow(1+r,t)-1)/r));
}
function vae(vpn, rate, n){ if(!ok(vpn)||!n||rate<=-1) return null;
  return vpn*rate/(1-Math.pow(1+rate,-n)); }
function paybackDesc(acum){
  if(acum[acum.length-1]<0) return null;
  return acum.filter(v=>v<0).length;
}
/* busca el valor de x que hace f(x)=0 por bisección */
function solve(f, lo, hi){
  let flo=f(lo), fhi=f(hi);
  if(!ok(flo)||!ok(fhi)||flo*fhi>0) return null;
  for(let i=0;i<200;i++){ const m=(lo+hi)/2, fm=f(m);
    if(!ok(fm)) return null;
    if(flo*fm<=0){hi=m;fhi=fm;} else {lo=m;flo=fm;} }
  return (lo+hi)/2;
}

/* ============================ estado ============================ */
const DEF = {
  sup:{ isr:0.30, inf:0.045, rf:0.095, prm:0.065, beta:1.10, ptam:0.020,
        kd:0.145, wd:0.30,
        pMaq:0.00, pInm:-0.050, pAuto:0.00, pTer:0.030, pEmp:0.050 },
  maq:{ precio:1200000, fletes:40000, instal:90000, capac:20000,
        venta:0, libros:0, ve:8, vf:10,
        ing1:900000, gIng:0.05, aho1:120000, cos1:480000, gCos:0.045,
        pctCT:0.15, mto1:35000, rv:180000 },
  inm:{ precio:3500000, pctAdq:0.06, remod:120000,
        ltv:0.50, th:0.115, plazo:15,
        rentaMes:37500, gRenta:0.05, vac:0.08, predial:9000, seguro:7000,
        pctMan:0.05, pctAdm:0.06, pctConstr:0.70, tasaDep:0.05,
        hor:10, capSal:0.080, pctCV:0.06 },
  ter:{ precio:1800000, pctAdq:0.06, bardeo:90000,
        predial:14000, vigilancia:30000, rentaTemp:0,
        plus:0.11, hor:7, pctCV:0.07 },
  auto:{ precio:620000, anios:5, rv:285000,
        seguro:24000, tenencia:8000, mto1:16000, gMto:0.08, combustible:0,
        pctEng:0.20, tc:0.155, plazoC:4,
        rentaMes:15500, deposito:30000, gRentaA:0.05, incluidos:1,
        ded:0.80, vfisc:4 },
  emp:{ capex:1800000, preop:250000, ct0:450000, pctDep:0.80, vf:10,
        ing1:4000000, g15:0.20, g610:0.08, mb:0.45, pctGO:0.22,
        pctMto:0.030, pctCT:0.18, hor:10, g:0.045, deudaNeta:0 },
  esc:{ p1:0.25, p2:0.50, p3:0.25,
        ing1:[650000,900000,1100000], gIng:[0.00,0.05,0.08],
        cos1:[560000,480000,430000], precio:[1350000,1200000,1150000],
        rv:[90000,180000,240000], ve:[6,8,9], td:[0.19,0.161,0.145] }
};
const KEY='p120-evaluador-v1';
let S = JSON.parse(JSON.stringify(DEF));
try{ const raw=localStorage.getItem(KEY); if(raw){ const o=JSON.parse(raw);
  for(const k in DEF) if(o[k]) S[k]=Object.assign({}, DEF[k], o[k]); } }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ============================ modelos ============================ */
function calcSup(){
  const s=S.sup;
  const ke = s.rf + s.beta*s.prm + s.ptam;
  const kdt = s.kd*(1-s.isr);
  const we = 1-s.wd;
  const wacc = ke*we + kdt*s.wd;
  return { isr:s.isr, inf:s.inf, ke, kdt, we, wacc, kd:s.kd,
    tasas:{ maq:wacc+s.pMaq, inm:wacc+s.pInm, auto:kdt+s.pAuto,
            ter:wacc+s.pTer, emp:wacc+s.pEmp } };
}

function calcMaq(sup, ov){
  ov = ov||{};
  const m = Object.assign({}, S.maq, ov);
  const isr=sup.isr, inf=sup.inf, td = (ov.td!=null)? ov.td : sup.tasas.maq;
  const base = m.precio+m.fletes+m.instal+m.capac;
  const ct0  = m.pctCT*m.ing1;
  const efec = -(m.venta-m.libros)*isr;
  const inv0 = -(base+ct0)+m.venta+efec;
  const depA = m.vf? base/m.vf : 0;
  const vl   = Math.max(0, base - depA*Math.min(m.ve,m.vf));
  const Y=[]; let prevIng=0, acum=0;
  for(let t=0;t<=10;t++){
    const on = t>=1 && t<=m.ve;
    const ing = on? m.ing1*Math.pow(1+m.gIng,t-1) : 0;
    const aho = on? m.aho1*Math.pow(1+inf,t-1) : 0;
    const cos = on? -m.cos1*Math.pow(1+m.gCos,t-1) : 0;
    const ebitda = ing+aho+cos;
    const dep = (t>=1 && t<=Math.min(m.ve,m.vf))? -depA : 0;
    const ebit = ebitda+dep;
    const imp = -ebit*isr;
    const nopat = ebit+imp;
    const addDep = -dep;
    const dct = (t<=1)? 0 : -(m.pctCT*(ing-prevIng));
    const capex = on? -m.mto1*Math.pow(1+inf,t-1) : 0;
    const fcfOp = nopat+addDep+dct+capex;
    const invR  = (t===0)? inv0 : 0;
    const resc  = (t===m.ve)? m.rv - isr*(m.rv - vl) : 0;
    const recCT = (t===m.ve)? m.pctCT*ing : 0;
    const total = (t===0)? inv0 : fcfOp+invR+resc+recCT;
    const fac = 1/Math.pow(1+td,t);
    const desc = total*fac; acum += desc;
    Y.push({t,ing,aho,cos,ebitda,dep,ebit,imp,nopat,addDep,dct,capex,fcfOp,invR,resc,recCT,total,fac,desc,acum});
    prevIng = ing;
  }
  const cf = Y.map(y=>y.total);
  const vpn = Y.reduce((s,y)=>s+y.desc,0);
  return { m, td, base, ct0, inv0, depA, vl, Y, vpn,
    tir:irr(cf), tirm:mirr(cf, sup.kd, td),
    vaeV:vae(vpn, td, m.ve),
    ir: inv0<0 ? Y.slice(1).reduce((s,y)=>s+y.desc,0)/(-inv0) : null,
    pb: paybackDesc(Y.map(y=>y.acum)) };
}

function calcInm(sup, ov){
  ov = ov||{};
  const i = Object.assign({}, S.inm, ov);
  const isr=sup.isr, inf=sup.inf;
  const td = (ov.td!=null)? ov.td : sup.tasas.inm;
  const ke = sup.ke;
  const gAdq = i.precio*i.pctAdq;
  const invTot = i.precio+gAdq+i.remod;
  const monto = i.precio*i.ltv;
  const capProp = invTot-monto;
  const pago = monto>0? pmt(i.th, i.plazo, monto) : 0;
  const depA = i.precio*i.pctConstr*i.tasaDep;
  const rentaAnual = i.rentaMes*12;
  const Y=[]; let prevSaldo = monto;
  for(let t=0;t<=10;t++){
    const on = t>=1 && t<=i.hor;
    const rb  = on? rentaAnual*Math.pow(1+i.gRenta,t-1) : 0;
    const vac = -rb*i.vac;
    const rEf = rb+vac;
    const pre = on? -i.predial*Math.pow(1+inf,t-1) : 0;
    const seg = on? -i.seguro*Math.pow(1+inf,t-1) : 0;
    const man = -rEf*i.pctMan;
    const adm = -rEf*i.pctAdm;
    const noi = rEf+pre+seg+man+adm;
    let saldo;
    if(t===0) saldo = monto;
    else if(t > Math.min(i.plazo, i.hor)) saldo = 0;
    else saldo = saldoRest(i.th, t, pago, monto);
    const dep = on? -depA : 0;
    const intr = on? -(prevSaldo*i.th) : 0;
    const amo  = on? -(prevSaldo - saldo) : 0;
    const isr0 = -Math.max(0, noi+dep)*isr;
    const isr1 = -Math.max(0, noi+dep+intr)*isr;
    const vs   = (t===i.hor)? noi*(1+i.gRenta)/i.capSal : 0;
    const cv   = -vs*i.pctCV;
    const libros = invTot - depA*i.hor;
    const iga  = (t===i.hor)? -Math.max(0, vs+cv-libros)*isr : 0;
    const liq  = (t===i.hor)? -saldo : 0;
    const fu = (t===0)? -invTot : noi+isr0+vs+cv+iga;
    const fl = (t===0)? -capProp : noi+intr+amo+isr1+vs+cv+iga+liq;
    Y.push({t,rb,vac,rEf,pre,seg,man,adm,noi,saldo,dep,intr,amo,isr0,isr1,vs,cv,iga,liq,fu,fl,
            du:fu/Math.pow(1+td,t), dl:fl/Math.pow(1+ke,t)});
    prevSaldo = saldo;
  }
  let ac=0; Y.forEach(y=>{ ac+=y.du; y.acum=ac; });
  const vpnU = Y.reduce((s,y)=>s+y.du,0);
  const vpnL = Y.reduce((s,y)=>s+y.dl,0);
  return { i, td, ke, invTot, monto, capProp, pago, depA, rentaAnual, Y,
    vpn:vpnU, vpnL, tir:irr(Y.map(y=>y.fu)), tirL:irr(Y.map(y=>y.fl)),
    capEnt: invTot? Y[1].noi/invTot : null,
    coc: capProp? Y[1].fl/capProp : null,
    dscr: pago? Y[1].noi/pago : null,
    vaeV: vae(vpnU, td, i.hor),
    pctSalida: (function(){ const s=Y.slice(1).reduce((a,y)=>a+y.du,0);
      const term=(Y[i.hor]? (Y[i.hor].vs+Y[i.hor].cv+Y[i.hor].iga)/Math.pow(1+td,i.hor):0);
      return s? term/s : null; })() };
}

function calcTer(sup, ov){
  ov = ov||{};
  const g = Object.assign({}, S.ter, ov);
  const isr=sup.isr, inf=sup.inf;
  const td = (ov.td!=null)? ov.td : sup.tasas.ter;
  const gAdq = g.precio*g.pctAdq;
  const invTot = g.precio+gAdq+g.bardeo;
  const Y=[]; let ac=0, pvCarga=0;
  for(let t=0;t<=10;t++){
    const on = t>=1 && t<=g.hor;
    const valEst = t<=g.hor? g.precio*Math.pow(1+g.plus,t) : 0;
    const carga = on? -(g.predial+g.vigilancia)*Math.pow(1+inf,t-1) : 0;
    const ingT  = on? g.rentaTemp*Math.pow(1+inf,t-1) : 0;
    const impT  = -Math.max(0, ingT+carga)*isr;
    const venta = (t===g.hor)? valEst : 0;
    const cv    = -venta*g.pctCV;
    const iga   = (t===g.hor)? -Math.max(0, venta+cv-invTot)*isr : 0;
    const total = (t===0)? -invTot : carga+ingT+impT+venta+cv+iga;
    const desc = total/Math.pow(1+td,t); ac+=desc;
    if(t>=1) pvCarga += carga/Math.pow(1+td,t);
    Y.push({t,valEst,carga,ingT,impT,venta,cv,iga,total,desc,acum:ac});
  }
  const vpn = Y.reduce((s,y)=>s+y.desc,0);
  const plusEq = ov._ns ? null : solve(function(x){
    return calcTer(sup, Object.assign({}, ov, {plus:x, _ns:true})).vpn;
  }, -0.5, 2.0);
  return { g, td, invTot, Y, vpn, tir:irr(Y.map(y=>y.total)),
    vaeV:vae(vpn, td, g.hor), pvCarga,
    mult: invTot? (Y[g.hor]? Y[g.hor].venta/invTot : null) : null,
    plusEq };
}

function calcAuto(sup, ov){
  ov = ov||{};
  const a = Object.assign({}, S.auto, ov);
  const isr=sup.isr, inf=sup.inf;
  const td = (ov.td!=null)? ov.td : sup.tasas.auto;
  const eng = a.precio*a.pctEng;
  const fin = a.precio-eng;
  const pagoC = fin>0? pmt(a.tc, a.plazoC, fin) : 0;
  const depA = a.vfisc? a.precio/a.vfisc : 0;
  const rentaAnual = a.rentaMes*12;
  const Y=[]; let prevSaldo=fin;
  for(let t=0;t<=10;t++){
    const on = t>=1 && t<=a.anios;
    const comun = on? -((a.seguro+a.tenencia+a.combustible)*Math.pow(1+inf,t-1)
                        + a.mto1*Math.pow(1+a.gMto,t-1)) : 0;
    const escC = -comun*isr*a.ded;
    const escD = (t>=1 && t<=Math.min(a.vfisc,a.anios))? depA*isr*a.ded : 0;
    const libros = Math.max(0, a.precio - depA*Math.min(a.anios,a.vfisc));
    const rev = (t===a.anios)? a.rv - isr*(a.rv - libros) : 0;
    let saldo;
    if(t===0) saldo=fin;
    else if(t > Math.min(a.plazoC, a.anios)) saldo=0;
    else saldo = saldoRest(a.tc, t, pagoC, fin);
    const pagoT = (t>=1 && t<=Math.min(a.plazoC,a.anios))? -pagoC : 0;
    const escI  = on? prevSaldo*a.tc*isr*a.ded : 0;
    const liq   = (t===a.anios)? -saldo : 0;
    const renta = on? -rentaAnual*Math.pow(1+a.gRentaA,t-1) : 0;
    const escR  = -renta*isr*a.ded;
    const comC  = comun*(1-a.incluidos);
    const escCC = -comC*isr*a.ded;
    const dev   = (t===a.anios)? a.deposito : 0;
    const A = (t===0)? -a.precio : comun+escC+escD+rev;
    const B = (t===0)? -eng      : comun+escC+escD+rev+pagoT+escI+liq;
    const C = (t===0)? -a.deposito : renta+escR+comC+escCC+dev;
    Y.push({t,comun,escC,escD,rev,saldo,pagoT,escI,liq,renta,escR,comC,escCC,dev,A,B,C,
            dA:A/Math.pow(1+td,t), dB:B/Math.pow(1+td,t), dC:C/Math.pow(1+td,t)});
    prevSaldo=saldo;
  }
  const vpA=Y.reduce((s,y)=>s+y.dA,0), vpB=Y.reduce((s,y)=>s+y.dB,0), vpC=Y.reduce((s,y)=>s+y.dC,0);
  const arr=[{n:'A · Contado',v:vpA},{n:'B · Crédito',v:vpB},{n:'C · Arrendamiento',v:vpC}]
            .sort((x,y)=>y.v-x.v);
  return { a, td, eng, fin, pagoC, depA, rentaAnual, Y,
    vpA, vpB, vpC,
    caeA:vae(vpA,td,a.anios), caeB:vae(vpB,td,a.anios), caeC:vae(vpC,td,a.anios),
    ganador:arr[0].n, ahorro:arr[0].v-arr[1].v, orden:arr };
}

function calcEmp(sup, ov){
  ov = ov||{};
  const e = Object.assign({}, S.emp, ov);
  const isr=sup.isr;
  const td = (ov.td!=null)? ov.td : sup.tasas.emp;
  const inv = e.capex+e.preop+e.ct0;
  const depA = e.vf? (e.capex+e.preop)*e.pctDep/e.vf : 0;
  const Y=[]; let prevIng=0, ac=0;
  for(let t=0;t<=10;t++){
    let ing=0;
    if(t>=1 && t<=e.hor) ing = (t===1)? e.ing1 : (t<=5? prevIng*(1+e.g15) : prevIng*(1+e.g610));
    const ub = ing*e.mb;
    const go = -ing*e.pctGO;
    const ebitda = ub+go;
    const dep = (t>=1 && t<=Math.min(e.vf,e.hor))? -depA : 0;
    const ebit = ebitda+dep;
    const imp = -Math.max(0,ebit)*isr;
    const nopat = ebit+imp;
    const addDep = -dep;
    const capex = -ing*e.pctMto;
    const dct = (t<=1)? 0 : -(e.pctCT*(ing-prevIng));
    const fcf = nopat+addDep+capex+dct;
    const vt = (t===e.hor && td>e.g)? fcf*(1+e.g)/(td-e.g) : 0;
    const total = (t===0)? -inv : fcf+vt;
    const desc = total/Math.pow(1+td,t); ac+=desc;
    Y.push({t,ing,ub,go,ebitda,dep,ebit,imp,nopat,addDep,capex,dct,fcf,vt,total,desc,acum:ac});
    prevIng = ing;
  }
  const pvFcf = Y.slice(1).reduce((s,y)=>s+y.fcf/Math.pow(1+td,y.t),0);
  const pvVt  = Y.slice(1).reduce((s,y)=>s+y.vt /Math.pow(1+td,y.t),0);
  const ev = pvFcf+pvVt;
  const vpn = Y.reduce((s,y)=>s+y.desc,0);
  return { e, td, inv, depA, Y, pvFcf, pvVt, ev, equity:ev-e.deudaNeta, vpn,
    tir:irr(Y.map(y=>y.total)), pctTv: ev? pvVt/ev : null,
    mult: Y[1].ebitda? ev/Y[1].ebitda : null };
}

let R = {};
function recompute(){
  const sup = calcSup();
  R = { sup, maq:calcMaq(sup), inm:calcInm(sup), ter:calcTer(sup),
        auto:calcAuto(sup), emp:calcEmp(sup) };
}

function body(parent){ const b=el('div','body'); parent.appendChild(b); return b; }

function field(g,k,label,hint,type){
  const f = el('div','field');
  const l = el('label'); l.appendChild(document.createTextNode(label));
  if(hint){ const sm=el('small',null,hint); l.appendChild(sm); }
  const box = el('div','ibox');
  const inp = el('input'); inp.type='number';
  inp.step = type==='pct' ? '0.1' : (type==='int' ? '1' : (type==='num' ? '0.01' : '1000'));
  const raw = S[g][k];
  inp.value = type==='pct' ? +(raw*100).toFixed(3) : raw;
  l.htmlFor = inp.id = 'f_'+g+'_'+k;
  if(type==='money') box.appendChild(el('span','pre','$'));
  box.appendChild(inp);
  if(type==='pct') box.appendChild(el('span','suf','%'));
  inp.addEventListener('input', function(){
    let v = parseFloat(inp.value);
    if(!isFinite(v)) v = 0;
    if(type==='pct') v = v/100;
    if(type==='int') v = Math.max(0, Math.round(v));
    S[g][k] = v; save(); refreshAll();
  });
  f.appendChild(l); f.appendChild(box);
  return f;
}
function derived(label, fmt, get, hint){
  const f = el('div','field');
  const l = el('label'); l.appendChild(document.createTextNode(label));
  if(hint) l.appendChild(el('small',null,hint));
  const v = el('div','derived','—');
  out(()=>{ v.textContent = fmt(get()); });
  f.appendChild(l); f.appendChild(v);
  return f;
}

    });
    g.appendChild(s);
  });

}

/* ---------- gráficas ---------- */
const NS='http://www.w3.org/2000/svg';
function sv(t,a){ const n=document.createElementNS(NS,t); for(const k in a) n.setAttribute(k,a[k]); return n; }
function areaChart(getVals, label){
  const boxEl = el('div','chartbox');
  const svg = sv('svg',{class:'chart', viewBox:'0 0 640 160'});
  boxEl.appendChild(svg);
  const cap = el('div','hint',label); boxEl.appendChild(cap);
  out(()=>{
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    const v = getVals(); const n=v.length;
    const mx = Math.max(...v, 0), mn = Math.min(...v, 0);
    const rng = (mx-mn)||1;
    const X = i => 20 + i*(600/(n-1));
    const Yc = k => 140 - ((k-mn)/rng)*122;
    const zero = Yc(0);
    svg.appendChild(sv('line',{x1:20,x2:620,y1:zero,y2:zero,stroke:'var(--rule-2)','stroke-width':1,'stroke-dasharray':'4 4'}));
    let d='M'+X(0)+' '+Yc(v[0]);
    for(let i=1;i<n;i++) d += ' L'+X(i)+' '+Yc(v[i]);
    const fill = d + ' L'+X(n-1)+' '+zero + ' L'+X(0)+' '+zero+' Z';
    svg.appendChild(sv('path',{d:fill, fill:'var(--accent)', opacity:.14}));
    svg.appendChild(sv('path',{d:d, fill:'none', stroke:'var(--accent)','stroke-width':2,'stroke-linejoin':'round'}));
    for(let i=0;i<n;i++){
      svg.appendChild(sv('circle',{cx:X(i), cy:Yc(v[i]), r: i===n-1?4:2.5,
        fill: i===n-1?'var(--accent)':'var(--surface)', stroke:'var(--accent)','stroke-width':1.5}));
    }
  });
  return boxEl;
}
function barChart(getItems){
  const boxEl = el('div','bars');
  out(()=>{
    boxEl.innerHTML = '';
    const it = getItems();
    const vals = it.map(o=>ok(o.v)?o.v:0);
    const mx = Math.max(...vals, 0), mn = Math.min(...vals, 0);
    const rng = (mx-mn)||1;
    const zero = (0-mn)/rng*100;
    it.forEach(o=>{
      const v = ok(o.v)? o.v : 0;
      const pv = (v-mn)/rng*100;
      const row = el('div','bar-row');
      row.appendChild(el('div','bar-name', o.name));
      const tr = el('div','bar-track');
      const z = el('div','bar-zero'); z.style.left = zero+'%'; tr.appendChild(z);
      const fl = el('div','bar-fill');
      fl.style.left = Math.min(zero,pv)+'%';
      fl.style.width = Math.max(0.6, Math.abs(pv-zero))+'%';
      fl.style.background = v>=0 ? 'var(--accent)' : 'var(--bad)';
      tr.appendChild(fl);
      row.appendChild(tr);
      const val = el('div','bar-val', nfM(o.v));
      val.style.color = v>=0 ? 'var(--accent)' : 'var(--bad)';
      row.appendChild(val);
      boxEl.appendChild(row);
    });
  });
  return boxEl;
}

  const row = el('div','btnrow'); row.style.paddingLeft='0'; row.style.paddingRight='0'; row.style.borderTop='0';
  const bImp = el('button','act','Aplicar lo pegado');
  bImp.addEventListener('click', ()=>{
    try{ const o = JSON.parse(ta.value);
      for(const k in DEF) if(o[k]) S[k]=Object.assign({}, DEF[k], o[k]);
      save(); rebuild(); }
    catch(e){ ta.value = 'No se pudo leer el texto. Revisa que esté completo y vuelve a pegarlo.'; }
  });
  const bRes = el('button','act ghost','Restablecer el ejemplo');
  bRes.addEventListener('click', ()=>{ S = JSON.parse(JSON.stringify(DEF)); save(); rebuild(); });
  row.appendChild(bImp); row.appendChild(bRes);
  b4.appendChild(row);

  w.appendChild(cols([c1,c2],[c3,c4]));
  return w;
}

    const v=R.emp.vpn, tv=R.emp.pctTv;
    if(ok(tv) && tv>0.7) return {tone:'mid', text:'El '+nfP(tv)+' del valor está en la perpetuidad. No valuaste un negocio: valuaste un supuesto de largo plazo. Alarga el horizonte o baja la g.'};
    if(v>0) return {tone:'ok', text:'Crea valor: el negocio vale más de lo que cuesta montarlo.'};
    return {tone:'no', text:'Destruye valor. Con estos supuestos no conviene abrirlo.'};
  }));
  cr.appendChild(areaChart(()=>R.emp.Y.map(y=>y.acum), 'Flujo descontado acumulado, incluyendo el valor terminal en el último año.'));

  const cf = card('Flujo de efectivo libre');
  cf.appendChild(flowTable(()=>R.emp.Y, [
    {lab:'Ingresos', f:y=>y.ing},
    {lab:'Utilidad bruta', f:y=>y.ub},
    {lab:'Gastos de operación (−)', f:y=>y.go},
    {lab:'EBITDA', f:y=>y.ebitda, sum:true},
    {lab:'Depreciación y amortización (−)', f:y=>y.dep},
    {lab:'EBIT', f:y=>y.ebit, sum:true},
    {lab:'ISR (−)', f:y=>y.imp},
    {lab:'NOPAT', f:y=>y.nopat, sum:true},
    {lab:'+ Depreciación y amortización', f:y=>y.addDep},
    {lab:'CapEx de mantenimiento (−)', f:y=>y.capex},
    {lab:'Capital de trabajo (−)', f:y=>y.dct},
    {lab:'Flujo de efectivo libre', f:y=>y.fcf, sum:true},
    {lab:'Valor terminal', f:y=>y.vt},
    {lab:'FLUJO TOTAL', f:y=>y.total, sum:true, hi:true},
    {lab:'Descontado acumulado', f:y=>y.acum}
  ]));
  w.appendChild(cols([ci],[cr,cf]));
  return w;
}

const DELTAS = [-0.04,-0.03,-0.02,-0.01,0,0.01,0.02,0.03,0.04];
function panelSen(){
  const w = el('div');
  w.appendChild(head('Sensibilidad',
    'Un VPN solo es una opinión disfrazada de cálculo. Estas tres tablas dicen qué tan frágil es y en qué supuesto conviene invertir tiempo de investigación.'));

  const c1 = card('VPN a distintas tasas de descuento');
  c1.appendChild(gridTable(()=>({
    head:['Variación sobre la tasa base','Maquinaria','Inmueble','Terreno','Empresa nueva'],
    rows: DELTAS.map(d=>{
      const cell = v => ({t:nfM(v), cls: v<0?'neg':null});
      return { cls: d===0?'hi':null,
        cells:[ (d===0? 'base · sin cambio' : (d>0?'+':'−')+Math.abs(d*100).toFixed(0)+(Math.abs(d*100)<1.5?' punto':' puntos')),
          cell(calcMaq(R.sup,{td:R.sup.tasas.maq+d}).vpn),
          cell(calcInm(R.sup,{td:R.sup.tasas.inm+d}).vpn),
          cell(calcTer(R.sup,{td:R.sup.tasas.ter+d, _ns:true}).vpn),
          cell(calcEmp(R.sup,{td:R.sup.tasas.emp+d}).vpn) ]};
    })
  })));
  c1.appendChild(el('div','note','Si el VPN cambia de signo dentro de dos puntos, la decisión depende de la tasa y no del activo. Ahí conviene afinar el WACC antes de firmar nada.'));

  const c2 = card('Maquinaria — VPN según ingresos y costos');
  c2.appendChild(gridTable(()=>{
    const base = S.maq;
    const ings = [-0.25,-0.125,0,0.125,0.25].map(k=>Math.round(base.ing1*(1+k)));
    const coss = [-0.25,-0.125,0,0.125,0.25].map(k=>Math.round(base.cos1*(1+k)));
    return {
      head:['Ingresos año 1  ↓   /   Costos →'].concat(coss.map(nfM)),
      rows: ings.map(iv=>({
        cells:[nfM(iv)].concat(coss.map(cv=>{
          const v = calcMaq(R.sup,{ing1:iv, cos1:cv}).vpn;
          return {t:nfM(v), cls: v<0?'neg':null};
        }))
      }))
    };
  }));
  c2.appendChild(el('div','note','Cada celda vuelve a correr el modelo completo con esos dos supuestos. La diagonal te dice si el proyecto aguanta que las dos cosas salgan mal a la vez.'));

  const c3 = card('Valores de equilibrio — el supuesto que deja el VPN en cero');
  c3.appendChild(gridTable(()=>{
    const rows = [];
    const eqIng = solve(x=>calcMaq(R.sup,{ing1:x}).vpn, 0, S.maq.ing1*6);
    rows.push({cells:['Maquinaria — ingresos año 1', nfM(eqIng), nfM(S.maq.ing1),
      {t: ok(eqIng)&&eqIng<S.maq.ing1 ? 'Con holgura' : 'Sin holgura',
       cls: ok(eqIng)&&eqIng<S.maq.ing1? null : 'neg'}]});
    const eqRen = solve(x=>calcInm(R.sup,{rentaMes:x}).vpn, 0, S.inm.rentaMes*6);
    rows.push({cells:['Inmueble — renta mensual', nfM(eqRen), nfM(S.inm.rentaMes),
      {t: ok(eqRen)&&eqRen<S.inm.rentaMes ? 'Con holgura' : 'Sin holgura',
       cls: ok(eqRen)&&eqRen<S.inm.rentaMes? null : 'neg'}]});
    const eqPlu = R.ter.plusEq;
    rows.push({cells:['Terreno — plusvalía anual', nfP(eqPlu), nfP(S.ter.plus),
      {t: ok(eqPlu)&&eqPlu<S.ter.plus ? 'Con holgura' : 'Sin holgura',
       cls: ok(eqPlu)&&eqPlu<S.ter.plus? null : 'neg'}]});
    const eqEmp = solve(x=>calcEmp(R.sup,{ing1:x}).vpn, 0, S.emp.ing1*6);
    rows.push({cells:['Empresa nueva — ingresos año 1', nfM(eqEmp), nfM(S.emp.ing1),
      {t: ok(eqEmp)&&eqEmp<S.emp.ing1 ? 'Con holgura' : 'Sin holgura',
       cls: ok(eqEmp)&&eqEmp<S.emp.ing1? null : 'neg'}]});
    return { head:['Activo y supuesto','Valor de equilibrio','Lo que supusiste','Lectura'], rows };
  }));
  c3.appendChild(el('div','note','Ésta es la prueba más honesta que existe: compara el valor de equilibrio contra lo que tu operación ha logrado de verdad. Si el equilibrio está arriba de tu mejor año, el proyecto no es ambicioso, es una ilusión.'));

  w.appendChild(c1); w.appendChild(c2); w.appendChild(c3);
  return w;
}

/* ---------------- Escenarios ---------------- */
const ESC_ROWS = [
  {k:'ing1', label:'Ingresos o ahorros año 1', type:'money'},
  {k:'gIng', label:'Crecimiento de ingresos', type:'pct'},
  {k:'cos1', label:'Costos año 1', type:'money'},
  {k:'precio', label:'Precio del equipo', type:'money'},
  {k:'rv', label:'Valor de rescate', type:'money'},
  {k:'ve', label:'Vida económica (años)', type:'int'},
  {k:'td', label:'Tasa de descuento', type:'pct'}
];
function escInput(k, idx, type){
  const inp = el('input'); inp.type='number';
  inp.step = type==='pct'?'0.1':(type==='int'?'1':'1000');
  inp.value = type==='pct' ? +(S.esc[k][idx]*100).toFixed(3) : S.esc[k][idx];
  inp.style.width='100%';
  inp.setAttribute('aria-label', k+' escenario '+(idx+1));
  inp.addEventListener('input', ()=>{
    let v = parseFloat(inp.value); if(!isFinite(v)) v=0;
    if(type==='pct') v=v/100; if(type==='int') v=Math.max(1,Math.round(v));
    S.esc[k][idx]=v; save(); refreshAll();
  });
  if(type!=='pct') return inp;
  const box = el('div','ibox'); box.appendChild(inp); box.appendChild(el('span','suf','%'));
  return box;
}
function escVpn(idx){
  const o = {}; ESC_ROWS.forEach(r=> o[r.k] = S.esc[r.k][idx]);
  return calcMaq(R.sup, o).vpn;
}
function panelEsc(){
  const w = el('div');
  w.appendChild(head('Escenarios',
    'Un solo VPN no dice qué tan malo puede ser. Aquí el modelo de maquinaria se corre tres veces completo, con sus propios supuestos, y se pondera. Cambia cualquier celda y los tres VPN se recalculan solos.'));

  const c1 = card('Supuestos de cada escenario');
  const tb = el('div','tscroll'); const t = el('table');
  const thead = el('thead'); const trh = el('tr');
  ['Variable','Pesimista','Base','Optimista'].forEach((h,i)=> trh.appendChild(el('th', i===0?'lab':null, h)));
  thead.appendChild(trh); t.appendChild(thead);
  const tbody = el('tbody');
  ESC_ROWS.forEach(r=>{
    const tr = el('tr');
    const th = el('th','lab',r.label); tr.appendChild(th);
    for(let i=0;i<3;i++){ const td = el('td'); td.appendChild(escInput(r.k,i,r.type)); tr.appendChild(td); }
    tbody.appendChild(tr);
  });
  const trP = el('tr','sum');
  trP.appendChild(el('th','lab','Probabilidad asignada'));
  ['p1','p2','p3'].forEach(pk=>{
    const td = el('td');
    const inp = el('input'); inp.type='number'; inp.step='5'; inp.style.width='100%';
    inp.value = +(S.esc[pk]*100).toFixed(1);
    inp.setAttribute('aria-label','Probabilidad '+pk);
    inp.addEventListener('input', ()=>{ let v=parseFloat(inp.value); if(!isFinite(v))v=0;
      S.esc[pk]=v/100; save(); refreshAll(); });
    const bx = el('div','ibox'); bx.appendChild(inp); bx.appendChild(el('span','suf','%'));
    td.appendChild(bx); trP.appendChild(td);
  });
  tbody.appendChild(trP);
  const trV = el('tr','hi');
  trV.appendChild(el('th','lab','VPN resultante'));
  const vCells = [];
  for(let i=0;i<3;i++){ const td = el('td','',''); vCells.push(td); trV.appendChild(td); }
  tbody.appendChild(trV);
  out(()=>{ for(let i=0;i<3;i++){ const v = escVpn(i);
    vCells[i].textContent = nfM(v); vCells[i].className = v<0?'neg':''; } });
  t.appendChild(tbody); tb.appendChild(t); c1.appendChild(tb);
  c1.appendChild(el('div','note','Sé coherente dentro de cada escenario: si en el pesimista baja el volumen, normalmente también baja el precio y sube la tasa que exiges.'));

  const c2 = card('Resultado ponderado');
  c2.appendChild(stats([
    {k:'VPN esperado', fmt:nfM, key:true,
      get:()=> S.esc.p1*escVpn(0) + S.esc.p2*escVpn(1) + S.esc.p3*escVpn(2)},
    {k:'Probabilidad de pérdida', fmt:nfP, sign:false,
      get:()=> [0,1,2].reduce((s,i)=> s + (escVpn(i)<0 ? [S.esc.p1,S.esc.p2,S.esc.p3][i] : 0), 0),
      n:'Peso de los escenarios con VPN negativo'},
    {k:'Peor caso', fmt:nfM, get:()=> Math.min(escVpn(0),escVpn(1),escVpn(2)), n:'Cuánto puedes perder'},
    {k:'Rango', fmt:nfM, sign:false,
      get:()=> Math.max(escVpn(0),escVpn(1),escVpn(2))-Math.min(escVpn(0),escVpn(1),escVpn(2))},
    {k:'Suma de probabilidades', fmt:nfP, sign:false, get:()=> S.esc.p1+S.esc.p2+S.esc.p3,
      n:'Debe dar 100%'}
  ]));
  c2.appendChild(verdict(()=>{
    const esp = S.esc.p1*escVpn(0)+S.esc.p2*escVpn(1)+S.esc.p3*escVpn(2);
    const pl = [0,1,2].reduce((s,i)=> s + (escVpn(i)<0 ? [S.esc.p1,S.esc.p2,S.esc.p3][i] : 0), 0);
    const suma = S.esc.p1+S.esc.p2+S.esc.p3;
    if(Math.abs(suma-1)>0.005) return {tone:'mid', text:'Las probabilidades suman '+nfP(suma)+'. Ajústalas a 100% para que el promedio signifique algo.'};
    if(esp<=0) return {tone:'no', text:'No pasa: el VPN esperado es negativo.'};
    if(pl>0.30) return {tone:'mid', text:'Pasa, pero hay '+nfP(pl)+' de probabilidad de perder. Define desde ahora cómo te sales si el escenario malo se cumple.'};
    return {tone:'ok', text:'Pasa con margen razonable.'};
  }));
  c2.appendChild(el('div','note','Un VPN esperado positivo con 40% de probabilidad de pérdida no es un buen proyecto: es una apuesta. Antes de firmar, pregúntate si la empresa aguanta el escenario pesimista completo.'));

  w.appendChild(c1); w.appendChild(c2);
  return w;
}

function rebuild(){
  UPD.length = 0;
  const row = $('#tabrow'), main = $('#main');
  row.innerHTML=''; main.innerHTML='';
  recompute();
  TABS.forEach(t=>{
    const btn = el('button','tab'); btn.type='button'; btn.setAttribute('role','tab');
    btn.setAttribute('aria-selected', String(t.id===current));
    btn.setAttribute('aria-controls','p_'+t.id);
    const dot = el('span','dot'); btn.appendChild(dot);
    btn.appendChild(document.createTextNode(t.n));

    const p = el('div','panel'); p.id='p_'+t.id; p.setAttribute('role','tabpanel');
    p.appendChild(t.b());
    p.hidden = (t.id!==current);
    main.appendChild(p); t._panel = p;
  });
  out(()=>{
    $('#chipWacc').textContent = nfP2(R.sup.wacc);
    $('#chipKe').textContent   = nfP2(R.sup.ke);
    $('#chipIsr').textContent  = nfP(R.sup.isr);
  });
  refreshAll();
}
function select(id){
  current = id;
  TABS.forEach(t=>{ t._btn.setAttribute('aria-selected', String(t.id===id)); t._panel.hidden = (t.id!==id); });
  window.scrollTo({top:0, behavior:'auto'});
}

    const next = dark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem(KEY+'-theme', next); }catch(e){}
  });
})();

rebuild();
})();
</script>
